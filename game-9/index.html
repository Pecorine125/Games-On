    <script id="patch-subpasta">
        if(!document.querySelector("base")){
            let p = window.location.pathname;
            if(/\.[a-zA-Z0-9]+$/.test(p)) { p = p.substring(0, p.lastIndexOf("/") + 1); }
            if(!p.endsWith("/")) { p += "/"; }
            let b = document.createElement("base"); b.href = p;
            document.head.appendChild(b);
            console.log("🎯 [Patch Subpasta] Rota corrigida com sucesso para: " + p);
        }
    </script>

        <script>
        console.log("🌍 [Tradutor Ativado] Injetando tradução dinâmica PT-BR...");
        window.addEventListener('load', function() {
            async function traduzirTexto(texto) {
                if(!texto || texto.trim().length < 2 || /^[0-9]+$/.test(texto)) return texto;
                try {
                    let res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=pt&dt=t&q=${encodeURIComponent(texto)}`);
                    let json = await res.json();
                    return json[0][0][0];
                } catch(e) { return texto; }
            }
            const observer = new MutationObserver(async (mutations) => {
                for (let mutation of mutations) {
                    if (mutation.type === 'childList' || mutation.type === 'characterData') {
                        let nos = mutation.target.childNodes;
                        for(let no of nos) {
                            if(no.nodeType === Node.TEXT_NODE && no.nodeValue.trim() !== "") {
                                let original = no.nodeValue.trim();
                                if(!original.startsWith("[PT]")) {
                                    observer.disconnect();
                                    let traduzido = await traduzirTexto(original);
                                    no.nodeValue = "[PT] " + traduzido;
                                    observer.observe(document.body, { childList: true, subtree: true, characterData: true });
                                }
                            }
                        }
                    }
                }
            });
            observer.observe(document.body, { childList: true, subtree: true, characterData: true });
        });
        </script>
