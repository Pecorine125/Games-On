<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Galeria de Jogos HTML5</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121214; color: #fff; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #4f46e5; margin-bottom: 10px; }
        p.subtitle { text-align: center; color: #a1a1aa; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: #1f1f23; border-radius: 10px; padding: 15px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 1px solid #2e2e35; transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
        .capa { width: 100%; height: 150px; object-fit: cover; border-radius: 6px; background-color: #2a2a30; }
        .nome { font-size: 16px; font-weight: bold; margin: 12px 0; min-height: 40px; display: flex; align-items: center; justify-content: center; }
        .btn-play { background-color: #10b981; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; text-decoration: none; display: block; box-sizing: border-box; transition: background 0.2s; }
        .btn-play:hover { background-color: #059669; }
    </style>
</head>
<body>
    <h1>🎮 Meu Portfólio de Jogos Web</h1>
    <p class="subtitle">Selecione um jogo abaixo para jogar direto no seu navegador!</p>
    
    <div class="grid">
        <div class="card">
            <img class="capa" src="https://img.itch.zone/aW1nLzIwNjU2NTY1LmpwZw==/315x250%23c/zqHoJG.jpg" alt="Game 8">
            <div class="nome">Game 8 (Horny Doctor)</div>
            <a class="btn-play" href="jogos_baixados/Game 8/index.html" target="_blank">▶ Jogar</a>
        </div>

        <div class="card">
            <img class="capa" src="https://img.itch.zone/aW1nLzIwNjcyMTc0LmpwZw==/315x250%23c/ua5aDt.jpg" alt="Game 7">
            <div class="nome">Game 7</div>
            <a class="btn-play" href="jogos_baixados/Game 7/index.html" target="_blank">▶ Jogar</a>
        </div>
    </div>
</body>
</html>
