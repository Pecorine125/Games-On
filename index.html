<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games On</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="menu-container" id="menuContainer">
        <h1>Games On</h1>
        <div class="games-grid" id="gamesGrid">
            </div>
    </div>

    <div class="game-screen" id="gameScreen">
        <div class="control-bar">
            <button class="btn" id="btnBack">Back Menu</button>
            <button class="btn" id="btnFullscreen">Tela Cheia</button>
            <button class="btn btn-close" id="btnCloseWeb">Close Web</button>
        </div>
        <div class="iframe-container">
            <iframe id="gameIframe" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
