<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Minha Galeria de Jogos</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="gallery-screen" class="screen active">
        <header>
            <h1>Meus Jogos Web</h1>
        </header>
        <div class="games-grid" id="games-container"></div>
    </div>

    <div id="player-screen" class="screen">
        <button class="back-btn" onclick="fecharJogo()">⬅ Voltar</button>
        <iframe id="game-iframe" sandbox="allow-scripts allow-same-origin allow-forms" allow="autoplay; gamepad; fullscreen; accelerometer; gyroscope"></iframe>
    </div>

    <script src="jogos.js"></script>
    <script src="app.js"></script>
</body>
</html>
