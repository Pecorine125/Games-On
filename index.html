<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Games On</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:;base64,=">
</head>
<body>

  <!-- MENU -->
  <div id="menu" class="active">
    <h1>🎮 Games On</h1>
    
    <div class="search-container">
      <input type="text" id="search-input" placeholder="🔎 Buscar jogo..." onkeyup="filterGames()">
      <div class="status" id="status">Atualizando automaticamente...</div>
    </div>

    <div class="grid" id="game-grid"></div>
  </div>

  <!-- TELA DO JOGO -->
  <div id="game-screen">
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>Carregando jogo...</p>
    </div>
    
    <iframe id="game-iframe" allowfullscreen allow="fullscreen"></iframe>
    
    <div class="controls">
      <button onclick="backToMenu()">← Menu</button>
      <button onclick="toggleFullscreen()">⛶ Tela Cheia</button>
      <button onclick="closeGame()">✕ Fechar</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
