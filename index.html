<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games On</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Menu Principal com o Carrossel e Controles de Save -->
    <div class="menu-container fade-element" id="menuContainer">
        <h1>Games On</h1>
        
        <!-- Controles de Save/Load -->
        <div class="save-load-bar">
            <button class="btn btn-save" id="btnSave">Salvar Progresso</button>
            <button class="btn btn-load" id="btnLoad">Carregar Save</button>
        </div>

        <!-- Estrutura do Carrossel (Uma imagem de 600x300 com duas setas) -->
        <div class="carousel-container">
            <button class="arrow-btn" id="prevBtn">&#10094;</button>
            
            <div class="games-slider" id="gamesSlider">
                <!-- O card do jogo atual será gerado dinamicamente aqui -->
            </div>
            
            <button class="arrow-btn" id="nextBtn">&#10095;</button>
        </div>
    </div>

    <!-- Tela do jogo dentro do próprio site -->
    <div class="game-screen fade-element hidden" id="gameScreen">
        <div class="control-bar">
            <button class="btn" id="btnBack">Back Menu</button>
            <button class="btn" id="btnFullscreen">Tela Cheia</button>
            <button class="btn btn-close" id="btnCloseWeb">Close Web</button>
        </div>
        <div class="iframe-container">
            <iframe 
                id="gameIframe" 
                src="" 
                scrolling="no"
                allowtransparency="true"
                allowfullscreen="true"
                webkitallowfullscreen="true" 
                mozallowfullscreen="true" 
                msallowfullscreen="true"
                frameborder="0"
                sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-downloads"
                allow="autoplay; fullscreen *; geolocation; microphone; camera; midi; monetization; xr-spatial-tracking; gamepad; gyroscope; accelerometer; xr; cross-origin-isolated; web-share">
            </iframe>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
