<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Launcher de Jogos</title>
  
  <!-- Configurações PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- AVISO DE ROTAÇÃO (MOBILE) -->
  <div id="rotateWarning" class="hidden">
    <p>Gire o dispositivo para o modo Paisagem (Deitado)</p>
  </div>

  <!-- MENU PRINCIPAL / CARROSSEL -->
  <main id="menuContainer" class="menu-container">
    <!-- SELETOR DE IDIOMA -->
    <div class="lang-selector">
      <button onclick="i18n.setLang('pt')" class="lang-btn">PT 🇧🇷</button>
      <button onclick="i18n.setLang('en')" class="lang-btn">EN 🇺🇸</button>
    </div>

    <h1 class="app-title">Web Games Launcher</h1>
    
    <div class="carousel-wrapper">
      <button id="prevBtn" class="nav-btn" aria-label="Jogo Anterior">&#10094;</button>
      <div id="gamesSlider" class="games-slider"></div>
      <button id="nextBtn" class="nav-btn" aria-label="Próximo Jogo">&#10095;</button>
    </div>
  </main>

  <!-- TELA DO JOGO (IFRAME) -->
  <section id="gameScreen" class="game-screen hidden">
    <div class="game-controls">
      <button id="btnBack" class="ctrl-btn">Voltar ao Menu</button>
      <button id="btnFullscreen" class="ctrl-btn">Tela Cheia</button>
    </div>
    
    <div class="iframe-container" id="iframeContainer">
      <!-- O iframe é gerado dinamicamente via JS para economizar memória RAM -->
    </div>
  </section>

  <script src="./i18n.js"></script>
  <script src="./script.js"></script>
</body>
</html>
